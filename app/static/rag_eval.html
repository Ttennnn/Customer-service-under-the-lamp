<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>RAG 评估 · 四策略对照</title>
<style>
  :root {
    --page: #121110;
    --panel: #1a1816;
    --raised: #24211d;
    --well: #151311;
    --line: rgba(240, 233, 223, 0.08);
    --line-strong: rgba(240, 233, 223, 0.16);
    --text: #f0e9df;
    --text-2: #b3a99b;
    --dim: #8a8073;
    --accent: #e2ae63;
    --accent-hover: #ebbb77;
    --accent-ink: #1a1512;
    --red: #cf7458;
    --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --strat-dense: #8ba0b8;
    --strat-bm25: #b79a72;
    --strat-hybrid: #8fa586;
    --strat-hybrid-rerank: #e2ae63;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background: var(--page);
    font: 14px/22px var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(226, 174, 99, 0.25); }
  :where(button, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body { padding: 24px 24px 64px; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  header { display: flex; gap: 24px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  h1 { font-size: 24px; line-height: 32px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: var(--text-2); font-size: 13px; line-height: 20px; max-width: 62ch; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, .linkbtn {
    display: inline-flex;
    align-items: center;
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  button:hover, .linkbtn:hover { background: var(--raised); border-color: var(--line-strong); color: var(--text); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 500; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); color: var(--accent-ink); }
  .status { margin-top: 16px; min-height: 16px; color: var(--dim); font: 11.5px/16px var(--mono); }
  .status.error { color: var(--red); }
  .meta {
    margin: 14px 0 0;
    display: flex;
    gap: 6px 24px;
    flex-wrap: wrap;
    color: var(--dim);
    font: 11.5px/16px var(--mono);
  }
  .meta b { color: var(--text-2); font-weight: 500; }
  .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-top: 20px; }
  .side { display: grid; gap: 16px; align-content: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .card h2 { font-size: 14px; line-height: 20px; font-weight: 500; margin: 0 0 2px; }
  .card .hint { color: var(--dim); font-size: 12px; line-height: 18px; margin: 0 0 16px; }
  .chart-main { display: flex; flex-direction: column; }
  .chart-main .bars { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 4px; }
  .chart-main .bar-row { grid-template-columns: 104px minmax(0, 1fr) 56px; gap: 12px; margin: 8px 0; font-size: 12.5px; }
  .chart-main .bar-track { height: 10px; }
  .bar-row { display: grid; grid-template-columns: 84px minmax(0, 1fr) 48px; gap: 10px; align-items: center; margin: 10px 0; font-size: 12px; }
  .bar-name { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 6px; border-radius: 2px; background: var(--raised); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; background: var(--accent); }
  .bar-val { text-align: right; font: 11.5px/16px var(--mono); font-variant-numeric: tabular-nums; color: var(--text-2); }
  .table-card { margin-top: 16px; }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 500; font-size: 11.5px; }
  td { color: var(--text-2); }
  td:first-child { color: var(--text); }
  tbody tr { transition: background-color 0.12s; }
  tbody tr:hover td { background: rgba(240, 233, 223, 0.03); }
  tbody tr:last-child td { border-bottom: 0; }
  .num { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .best { color: var(--accent); font-weight: 500; }
  .tabs { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; margin: 0 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--well); max-width: 100%; }
  .tab { flex: 0 0 auto; height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--dim); font-size: 12px; white-space: nowrap; }
  .tab:hover { background: transparent; color: var(--text-2); }
  .tab.active { color: var(--text); background: var(--raised); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }
  .empty { color: var(--dim); padding: 48px 16px; text-align: center; font-size: 13px; line-height: 22px; }
  .foot { margin-top: 20px; color: var(--dim); font: 12px/18px var(--sans); }
  .tag { display: inline-block; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--dim); font: 10.5px/16px var(--mono); }
  @media (max-width: 640px) {
    .table-scroll { mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 28px), transparent 100%); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>RAG 评估 · 四策略对照</h1>
      <div class="sub">检索排序、证据覆盖与端到端答案覆盖 · 四策略对照</div>
    </div>
    <div class="actions">
      <button id="run" class="primary" type="button">重跑评估</button>
      <a class="linkbtn" id="md" href="/rag-eval/api/report.md" target="_blank" rel="noreferrer">Markdown 报告</a>
      <a class="linkbtn" href="/kb">知识录入页</a>
    </div>
  </header>

  <div id="status" class="status"></div>
  <div id="meta" class="meta"></div>

  <main id="content">
    <div class="card empty" id="empty">尚无评估报告。点击「重跑评估」生成四策略对比。</div>
  </main>

  <div class="foot">
    <span class="tag">口径</span>
    Recall/MRR 只统计可答题，并按 section_path 去重；hybrid_rerank 的 rerank fallback 不参与其指标聚合。
    端到端答案覆盖率 = 可答题中实际产出答案的比例；Faithfulness / Citation validity 只统计成功裁判的答案。
    D 桶拒答准确率单独统计。完整口径见 Markdown 报告。
  </div>
</div>

<script>
(() => {
  const STRATEGY_COLORS = {
    dense: "#8ba0b8",
    bm25: "#b79a72",
    hybrid: "#8fa586",
    hybrid_rerank: "#e2ae63",
  };
  const BUCKET_LABELS = {
    A_policy: "A · 政策",
    B_model: "B · 型号",
    C_colloquial: "C · 口语",
    D_absent: "D · 应拒答",
    D_unanswerable: "D · 不可答",
    E_multi: "E · 多跳",
  };

  const $ = (id) => document.getElementById(id);
  let report = null;
  let activeBucket = null;

  function fmt(v) {
    return (typeof v === "number" && Number.isFinite(v)) ? v.toFixed(3) : "n/a";
  }
  function pct(v) {
    return (typeof v === "number" && Number.isFinite(v)) ? `${(v * 100).toFixed(1)}%` : "n/a";
  }
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function barRows(container, values, labelFn) {
    const entries = Object.entries(values);
    const nums = entries
      .map(([, v]) => Number(v))
      .filter((n) => Number.isFinite(n));
    const max = nums.length ? Math.max(...nums) : 1;
    const min = nums.length ? Math.min(...nums) : 0;
    const span = max - min;
    // 指标接近上限时按本图区间缩放,让排名差异可见;最低值保留 20% 柱长
    const lo = span > 0 ? min - span * 0.25 : min;
    for (const [name, value] of entries) {
      const row = el("div", "bar-row");
      row.appendChild(el("div", "bar-name", labelFn ? labelFn(name) : name));
      const track = el("div", "bar-track");
      const fill = el("div", "bar-fill");
      fill.style.background = STRATEGY_COLORS[name] || "var(--accent)";
      const n = Number(value);
      const width = span > 0 && Number.isFinite(n)
        ? ((n - lo) / (max - lo)) * 100
        : (Number.isFinite(n) ? 100 : 0);
      fill.style.width = `${Math.max(0, Math.min(100, width))}%`;
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("div", "bar-val", fmt(value)));
      container.appendChild(row);
    }
  }

  function strategyValues(metric) {
    const out = {};
    for (const name of report.strategies) {
      const s = report.overall[name] || {};
      out[name] = metric(s);
    }
    return out;
  }

  function metricTable(rows, label) {
    const table = el("table");
    const thead = el("thead");
    const hr = el("tr");
    for (const h of ["策略", label, "n"]) hr.appendChild(el("th", null, h));
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = el("tbody");
    for (const [name, value] of Object.entries(rows)) {
      const tr = el("tr");
      tr.appendChild(el("td", null, name));
      tr.appendChild(el("td", "num", fmt(value)));
      const s = report.overall[name] || {};
      const n = label.includes("答案") ? (s.generation || {}).n : (s.retrieval || {}).n;
      tr.appendChild(el("td", "num", String(n ?? "n/a")));
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    return table;
  }

  function wrapTable(table) {
    const box = el("div", "table-scroll");
    box.appendChild(table);
    return box;
  }

  function overallTable() {
    const table = el("table");
    const thead = el("thead");
    const head = ["策略", "Recall@5", "Recall@10", "MRR@10", "Faithfulness", "Citation", "答案覆盖", "拒答率", "D 正确率"];
    const hr = el("tr");
    for (const h of head) hr.appendChild(el("th", null, h));
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = el("tbody");
    for (const name of report.strategies) {
      const s = report.overall[name] || {};
      const r = s.retrieval || {};
      const g = s.generation || {};
      const d = s.d_accuracy || {};
      const tr = el("tr");
      const cells = [
        name, fmt(r.recall_at_5), fmt(r.recall_at_10), fmt(r.mrr_at_10),
        fmt(g.faithfulness), fmt(g.citation_validity), pct(g.answer_coverage),
        pct(g.refusal_rate), fmt(d.accuracy),
      ];
      cells.forEach((v, i) => tr.appendChild(el("td", i === 0 ? null : "num", v)));
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    return table;
  }

  function bucketTable(bucket) {
    const table = el("table");
    const thead = el("thead");
    const head = ["策略", "Recall@5", "Recall@10", "MRR@10", "Faithfulness", "Citation", "答案覆盖", "拒答率"];
    const hr = el("tr");
    for (const h of head) hr.appendChild(el("th", null, h));
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = el("tbody");
    const data = (report.buckets || {})[bucket] || {};
    for (const name of report.strategies) {
      const s = data[name] || {};
      const r = s.retrieval || {};
      const g = s.generation || {};
      const tr = el("tr");
      const cells = [
        name, fmt(r.recall_at_5), fmt(r.recall_at_10), fmt(r.mrr_at_10),
        fmt(g.faithfulness), fmt(g.citation_validity), pct(g.answer_coverage),
        pct(g.refusal_rate),
      ];
      cells.forEach((v, i) => tr.appendChild(el("td", i === 0 ? null : "num", v)));
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    return table;
  }

  function render(r) {
    report = r;
    const content = $("content");
    content.replaceChildren();

    const buckets = Object.keys(report.buckets || {});
    if (!activeBucket || !buckets.includes(activeBucket)) activeBucket = buckets[0] || null;

    const grid = el("div", "layout");

    const orderCard = el("section", "card chart-main");
    orderCard.appendChild(el("h2", null, "检索排序 · MRR@10"));
    orderCard.appendChild(el("div", "hint", "首个相关章节的排名倒数，越高越靠前；柱长按本图区间缩放"));
    const bars = el("div", "bars");
    barRows(bars, strategyValues((s) => (s.retrieval || {}).mrr_at_10));
    orderCard.appendChild(bars);
    grid.appendChild(orderCard);

    const side = el("div", "side");
    const evidenceCard = el("section", "card chart-side");
    evidenceCard.appendChild(el("h2", null, "证据覆盖 · Recall@10"));
    evidenceCard.appendChild(el("div", "hint", "有证据案例的覆盖率见下表；柱长按本图区间缩放"));
    barRows(evidenceCard, strategyValues((s) => (s.retrieval || {}).recall_at_10));
    side.appendChild(evidenceCard);

    const answerCard = el("section", "card chart-side");
    answerCard.appendChild(el("h2", null, "答案覆盖 · Faithfulness"));
    answerCard.appendChild(el("div", "hint", "事实均有证据支持的答案比例；柱长按本图区间缩放"));
    barRows(answerCard, strategyValues((s) => (s.generation || {}).faithfulness));
    side.appendChild(answerCard);

    grid.appendChild(side);
    content.appendChild(grid);

    const overall = el("section", "card table-card");
    overall.appendChild(el("h2", null, "总体指标"));
    overall.appendChild(wrapTable(overallTable()));
    content.appendChild(overall);

    const evidenceTable = el("section", "card table-card");
    evidenceTable.appendChild(el("h2", null, "证据覆盖明细"));
    const et = el("table");
    const eth = el("thead");
    const ehr = el("tr");
    for (const h of ["策略", "有证据案例", "案例覆盖率", "Recall@5", "Recall@10"]) ehr.appendChild(el("th", null, h));
    eth.appendChild(ehr); et.appendChild(eth);
    const etb = el("tbody");
    for (const name of report.strategies) {
      const r = ((report.overall[name] || {}).retrieval || {});
      const tr = el("tr");
      [name, String(r.cases_with_evidence ?? "n/a"), pct(r.evidence_case_coverage), fmt(r.recall_at_5), fmt(r.recall_at_10)]
        .forEach((v, i) => tr.appendChild(el("td", i === 0 ? null : "num", v)));
      etb.appendChild(tr);
    }
    et.appendChild(etb);
    evidenceTable.appendChild(wrapTable(et));
    content.appendChild(evidenceTable);

    if (buckets.length) {
      const bucketCard = el("section", "card table-card");
      bucketCard.appendChild(el("h2", null, "分桶指标"));
      const tabs = el("div", "tabs");
      for (const bucket of buckets) {
        const btn = el("button", "tab" + (bucket === activeBucket ? " active" : ""), BUCKET_LABELS[bucket] || bucket);
        btn.type = "button";
        btn.addEventListener("click", () => { activeBucket = bucket; render(report); });
        tabs.appendChild(btn);
      }
      bucketCard.appendChild(tabs);
      bucketCard.appendChild(wrapTable(bucketTable(activeBucket)));
      content.appendChild(bucketCard);
    }

    const house = el("section", "card table-card");
    house.appendChild(el("h2", null, "运行与台账"));
    const list = el("div", "foot");
    const fb = report.fallbacks || {};
    const rerank = (fb.rerank || {});
    const rewrite = (fb.rewrite || {});
    const faith = report.faith_cases || {};
    const excluded = report.excluded || {};
    const run = report.run || {};
    const lines = [
      `模型：${run.model || "n/a"}（温度 0）；嵌入 ${run.embedding_model || "n/a"}；重排 ${run.rerank_model || "n/a"}`,
      `召回 Top-${run.recall_top_k ?? "?"} → 最终 Top-${run.top_k ?? "?"}；RRF k=${run.rrf_k ?? "?"}`,
      `Rerank fallback：${rerank.runs ?? 0} 次${(rerank.case_ids || []).length ? "（" + rerank.case_ids.join(", ") + "）" : ""}；Query rewrite fallback：${rewrite.cases ?? 0} 例`,
      `faith_cases：新增 ${faith.new ?? 0} / 复发 ${faith.recurrence ?? 0} / 写入错误 ${faith.errors ?? 0}`,
      `排除用例：${excluded.count ?? 0} 例${(excluded.count ?? 0) ? "（语料未覆盖/冲突，详见 Markdown 报告）" : ""}`,
    ];
    for (const line of lines) list.appendChild(el("div", null, line));
    house.appendChild(list);
    content.appendChild(house);

    const meta = $("meta");
    meta.replaceChildren();
    const fields = [
      ["生成时间", String(report.generated_at || "n/a").replace("T", " ").slice(0, 19)],
      ["commit", report.commit || "n/a"],
      ["case 数", String(report.cases ?? "n/a")],
      ["排除用例", String(excluded.count ?? 0)],
      ["模式", report.mode || "n/a"],
    ];
    for (const [k, v] of fields) {
      const span = el("span");
      span.appendChild(el("b", null, k + "："));
      span.appendChild(document.createTextNode(v));
      meta.appendChild(span);
    }
    $("empty")?.remove();
  }

  async function fetchReport() {
    const res = await fetch("/rag-eval/api/report", { cache: "no-store" });
    if (res.status === 404) {
      report = null;
      const content = $("content");
      content.replaceChildren();
      const empty = el("div", "card empty", "尚无评估报告。点击「重跑评估」生成四策略对比。");
      empty.id = "empty";
      content.appendChild(empty);
      return;
    }
    if (!res.ok) throw new Error(`report HTTP ${res.status}`);
    const data = await res.json();
    if (data && data.error) throw new Error(data.error);
    render(data);
  }

  function setStatus(text, isError) {
    const node = $("status");
    node.textContent = text || "";
    node.className = "status" + (isError ? " error" : "");
  }

  async function poll() {
    let status;
    try {
      const res = await fetch("/rag-eval/api/status", { cache: "no-store" });
      status = await res.json();
    } catch (err) {
      setStatus("状态读取失败：" + err.message, true);
      return;
    }
    if (status.running) {
      $("run").disabled = true;
      $("run").textContent = "评估运行中…";
      setStatus(`运行中，开始于 ${status.started_at || "?"}。全部策略预计数分钟。`);
      setTimeout(poll, 2000);
      return;
    }
    $("run").disabled = false;
    $("run").textContent = "重跑评估";
    if (status.last_error) {
      setStatus("上次运行失败：" + status.last_error, true);
    } else if (status.finished_at) {
      setStatus(`上次完成于 ${status.finished_at}（exit ${status.exit_code ?? 0}）`);
    } else {
      setStatus("就绪");
    }
    if (status.finished_at) {
      try { await fetchReport(); } catch (err) { setStatus("报告读取失败：" + err.message, true); }
    }
  }

  $("run").addEventListener("click", async () => {
    $("run").disabled = true;
    setStatus("正在启动评估…");
    try {
      const res = await fetch("/rag-eval/api/run", { method: "POST" });
      if (res.status === 409) {
        setStatus("已有评估在运行中。", true);
      } else if (!res.ok) {
        setStatus(`启动失败：HTTP ${res.status}`, true);
      } else {
        setStatus("评估已启动。");
      }
    } catch (err) {
      setStatus("启动失败：" + err.message, true);
    }
    setTimeout(poll, 1000);
  });

  (async () => {
    try { await fetchReport(); } catch (err) { setStatus("报告读取失败：" + err.message, true); }
    await poll();
  })();
})();
</script>
<script src="/static/admin.js" defer></script>
</body>
</html>
