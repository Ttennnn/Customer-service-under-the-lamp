<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>类目问题 · 灯下后台</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #171310; --surface: #211b16; --surface-2: #2a231c;
    --border: #332b24; --text: #f2e9de; --dim: #a29284;
    --accent: #f0b76a; --green: #86a96b; --red: #d97757;
    --panel: #211b16; --muted: #a29284; --chip: #2a231c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 18px 48px; background:
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(240,183,106,.12), transparent 70%),
      var(--bg);
    color: var(--text); font: 14px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .page { max-width: 1120px; margin: 0 auto; }
  .page-header { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { margin: 0 0 5px; font-size: 21px; letter-spacing: .02em; }
  .subtitle { margin: 0; color: var(--dim); font-size: 12.5px; line-height: 1.6; }
  .linkbtn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px; padding: 6px 12px; font-size: 12.5px; text-decoration: none; }
  .linkbtn:hover { border-color: var(--accent); color: var(--accent); }
  .panel { background: linear-gradient(180deg, rgba(42,35,28,.55), rgba(33,27,22,.9)); border: 1px solid var(--border); border-radius: 14px; padding: 15px 16px; }
  .status { min-height: 20px; margin: 6px 0; color: var(--dim); font-size: 12.5px; }
  .status.error { color: var(--red); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; white-space: nowrap; font-size: 11.5px; }
  tbody tr:hover td { background: rgba(240,183,106,.035); }
  .muted { color: var(--dim); }
  .chip { display: inline-block; color: var(--dim); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; margin: 1px 4px 1px 0; font-size: 11.5px; }
  .badge-warn { color: var(--red); background: rgba(217,119,87,.14); border: 1px solid rgba(217,119,87,.35); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; }
  .pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 12px; }
  .pager button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 9px; padding: 6px 11px; cursor: pointer; font: inherit; font-size: 12.5px; }
  .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pager button:disabled { opacity: .4; cursor: default; }
  .empty { color: var(--dim); padding: 14px 0; font-size: 12.5px; }
</style>
</head>
<body>
<div id="admin-nav"></div>
<div class="page">
  <header class="page-header">
    <div>
      <h1 id="title">类目问题</h1>
      <p class="subtitle" id="subtitle">分页查看这一类下归类到的全部问题；多标签问题会在命中的每个类目下出现。</p>
    </div>
    <a class="linkbtn" href="/topics">返回主题分布</a>
  </header>

  <p id="status" class="status" role="status" aria-live="polite">加载中…</p>

  <main class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>标准化问法</th>
            <th>用户原话</th>
            <th>命中类目</th>
            <th>来源</th>
            <th>同义合并</th>
            <th>审核状态</th>
            <th>落池时间</th>
            <th>归类时间</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden>这一类还没有问题。</p>
    <div class="pager">
      <span id="page-info" class="muted"></span>
      <button id="prev" type="button">上一页</button>
      <button id="next" type="button">下一页</button>
    </div>
  </main>
</div>

<script src="/static/admin.js" defer></script>
<script>
(function () {
  "use strict";

  var params = new URLSearchParams(window.location.search);
  var label = params.get("label") || "";
  var page = Math.max(1, parseInt(params.get("page") || "1", 10) || 1);
  var size = Math.max(1, Math.min(100, parseInt(params.get("size") || "20", 10) || 20));

  var titleEl = document.getElementById("title");
  var subtitleEl = document.getElementById("subtitle");
  var statusEl = document.getElementById("status");
  var rowsEl = document.getElementById("rows");
  var emptyEl = document.getElementById("empty");
  var pageInfoEl = document.getElementById("page-info");
  var prevEl = document.getElementById("prev");
  var nextEl = document.getElementById("next");

  function setStatus(message, kind) {
    statusEl.className = "status" + (kind ? " " + kind : "");
    statusEl.textContent = message || "";
  }

  function fmtTime(value) {
    if (!value) return "—";
    var date = new Date(value);
    if (isNaN(date.getTime())) return String(value);
    return date.toLocaleString("zh-CN", { hour12: false });
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function cell(row, value) {
    var td = el("td");
    td.appendChild(value);
    row.appendChild(td);
  }

  function render(data) {
    titleEl.textContent = "类目问题 · " + data.label;
    subtitleEl.textContent = "共 " + data.total + " 条；多标签问题在命中的每个类目下都会出现。";
    rowsEl.textContent = "";
    emptyEl.hidden = data.total > 0;

    data.items.forEach(function (item) {
      var tr = el("tr");
      var textCell = el("td");
      textCell.appendChild(el("div", null, item.text || "—"));
      if (!item.normalized) {
        textCell.appendChild(el("span", "badge-warn", "原话兜底"));
      }
      tr.appendChild(textCell);

      cell(tr, el("div", "muted", item.raw_question || "—"));

      var labelsCell = el("td");
      (item.labels || []).forEach(function (labelName) {
        labelsCell.appendChild(el("span", "chip", labelName));
      });
      tr.appendChild(labelsCell);

      cell(tr, el("div", null, item.source || "—"));
      cell(tr, el("div", null, item.occurrence_count != null ? item.occurrence_count : "—"));
      cell(tr, el("div", null, item.review_status || "—"));
      cell(tr, el("div", null, fmtTime(item.created_at)));
      cell(tr, el("div", null, fmtTime(item.classified_at)));
      rowsEl.appendChild(tr);
    });

    pageInfoEl.textContent = "第 " + data.page + " / " + Math.max(data.pages, 1) + " 页";
    prevEl.disabled = data.page <= 1;
    nextEl.disabled = data.page >= data.pages;
  }

  function go(newPage) {
    var query = new URLSearchParams({ label: label, page: String(newPage), size: String(size) });
    window.location.href = "/topics/questions?" + query.toString();
  }

  function load() {
    if (!label) {
      setStatus("地址栏缺少 label 参数。", "error");
      return;
    }
    setStatus("加载中…");
    fetch("/api/topics/questions?label=" + encodeURIComponent(label) + "&page=" + page + "&size=" + size)
      .then(function (response) {
        if (!response.ok) {
          return response.text().then(function (raw) {
            var detail = "HTTP " + response.status;
            try {
              var data = raw ? JSON.parse(raw) : null;
              if (data && typeof data.detail === "string") detail = data.detail;
            } catch (err) { /* keep default */ }
            throw new Error(detail);
          });
        }
        return response.json();
      })
      .then(function (data) {
        render(data || {});
        setStatus("");
      })
      .catch(function (err) {
        setStatus("加载失败：" + err.message, "error");
        emptyEl.hidden = true;
      });
  }

  prevEl.addEventListener("click", function () { go(page - 1); });
  nextEl.addEventListener("click", function () { go(page + 1); });
  load();
})();
</script>
</body>
</html>
