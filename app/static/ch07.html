<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>灯下客服</title>
<style>
  :root {
    --bg: #171310;
    --surface: #211b16;
    --surface-2: #2a231c;
    --border: #332b24;
    --text: #f2e9de;
    --dim: #a29284;
    --accent: #f0b76a;
    --green: #86a96b;
    --red: #d97757;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--text);
    background:
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(240,183,106,.12), transparent 70%),
      var(--bg);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap {
    max-width: 1120px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 24px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  h1 { margin: 0 0 5px; font-size: 21px; letter-spacing: .02em; }
  .tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--dim);
    font-size: 11px;
    font-weight: 500;
    vertical-align: 2px;
  }
  .sub { margin: 0; color: var(--dim); font-size: 12.5px; line-height: 1.6; }
  .links { display: flex; gap: 8px; }
  .links a {
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 11px;
    font-size: 12px;
    text-decoration: none;
    transition: border-color .15s, color .15s;
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); }

  .chat-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: linear-gradient(180deg, rgba(42,35,28,.55), rgba(33,27,22,.9));
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .messages {
    flex: 1;
    min-height: 320px;
    max-height: calc(100vh - 240px);
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .empty {
    margin: auto;
    max-width: 420px;
    color: var(--dim);
    font-size: 13.5px;
    line-height: 1.8;
    text-align: center;
  }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--dim);
    font-size: 11px;
    user-select: none;
  }
  .msg.user .avatar { background: rgba(240,183,106,.14); border-color: rgba(240,183,106,.35); color: var(--accent); }
  .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: min(78%, 620px); }
  .msg.user .body { align-items: flex-end; }
  .bubble {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface-2);
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: rgba(240,183,106,.12); border-color: rgba(240,183,106,.32); }
  .bubble.error { color: var(--red); border-color: rgba(217,119,87,.5); }
  .typing { color: var(--dim); font-size: 13px; }
  .meta-line { color: var(--dim); font-size: 11.5px; line-height: 1.5; }
  .msg.system {
    justify-content: center;
    color: var(--dim);
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
    padding: 0 12px;
  }
  .msg.system.error { color: var(--red); }
  .options { display: flex; gap: 8px; flex-wrap: wrap; }
  .option-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 10px;
    padding: 7px 15px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .option-btn:disabled { opacity: .45; cursor: default; }

  /* Order picker (interrupt kind=select_order) */
  .picker-msg .body { max-width: min(88%, 660px); width: 100%; }
  .picker-bubble { width: 100%; padding: 14px; }
  .picker-title { margin-bottom: 10px; color: var(--dim); font-size: 12.5px; }
  .order-list { display: grid; gap: 8px; }
  .order-card {
    display: block;
    width: 100%;
    text-align: left;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .order-card:hover:not(:disabled) { border-color: var(--accent); background: rgba(240,183,106,.07); }
  .order-card:active:not(:disabled) { transform: translateY(1px); }
  .order-card:disabled { opacity: .45; cursor: default; }
  .order-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .order-no { font-weight: 600; font-size: 14px; letter-spacing: .02em; }
  .order-status {
    flex: 0 0 auto;
    padding: 1px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--dim);
    font-size: 11px;
  }
  .order-items { margin-top: 5px; font-size: 13px; }
  .order-sub { margin-top: 4px; color: var(--dim); font-size: 11.5px; line-height: 1.6; }
  .order-sub strong { color: var(--accent); font-weight: 600; }

  /* Ticket preview (interrupt kind=confirm_ticket) */
  .ticket-preview {
    display: grid;
    gap: 7px;
    width: 100%;
    padding: 12px 13px;
    border: 1px solid rgba(240,183,106,.35);
    border-radius: 10px;
    background: rgba(240,183,106,.05);
  }
  .ticket-preview-title {
    margin-bottom: 1px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .ticket-preview-field { font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
  .ticket-preview-label { color: var(--dim); }
  .ticket-preview-desc { white-space: pre-wrap; }
  .ticket-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 3px; }
  .option-btn.accent {
    border-color: rgba(240,183,106,.55);
    background: rgba(240,183,106,.12);
    color: var(--accent);
    font-weight: 600;
  }

  /* Refund form (options action=refund_form) */
  .refund-form {
    display: grid;
    gap: 10px;
    width: 100%;
    padding: 13px 14px;
    border: 1px solid rgba(240,183,106,.35);
    border-radius: 12px;
    background: rgba(240,183,106,.05);
  }
  .refund-form h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--accent); }
  .refund-form label { display: grid; gap: 5px; color: var(--dim); font-size: 12px; }
  .refund-form input,
  .refund-form select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  .refund-form input[readonly] { color: var(--dim); }
  .refund-form select:focus, .refund-form input:focus { outline: none; border-color: var(--accent); }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .refund-form button {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #1a1512;
    border-radius: 8px;
    padding: 7px 14px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .refund-form button.secondary {
    border-color: var(--border);
    background: var(--surface);
    color: var(--text);
    font-weight: 500;
  }
  .refund-form button:disabled { opacity: .5; cursor: default; }
  .form-result { font-size: 12.5px; line-height: 1.6; }
  .form-result.ok { color: var(--green); }
  .form-result.error { color: var(--red); }

  .composer {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: rgba(23,19,16,.55);
  }
  textarea {
    flex: 1;
    min-height: 42px;
    max-height: 150px;
    resize: none;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea:disabled { opacity: .55; cursor: not-allowed; }
  .primary {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #1a1512;
    border-radius: 10px;
    padding: 10px 20px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .primary:hover:not(:disabled) { filter: brightness(1.05); }
  .primary:disabled { opacity: .5; cursor: default; }
  .foot { margin: 0; color: var(--dim); font-size: 11.5px; line-height: 1.6; text-align: center; }

  /* Multi-conversation sidebar */
  .layout {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 14px;
  }
  .sidebar {
    flex: 0 0 240px;
    width: 240px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    background: linear-gradient(180deg, rgba(42,35,28,.55), rgba(33,27,22,.9));
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sidebar-title { color: var(--dim); font-size: 12px; letter-spacing: .08em; }
  .new-conversation {
    border: 1px solid rgba(240,183,106,.45);
    background: rgba(240,183,106,.12);
    color: var(--accent);
    border-radius: 9px;
    padding: 6px 10px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  .new-conversation:hover:not(:disabled) { background: rgba(240,183,106,.2); }
  .new-conversation:disabled { opacity: .45; cursor: default; }
  .conversation-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .conversation-list.locked .conversation-item { pointer-events: none; opacity: .55; }
  .conversation-item {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 9px 10px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .conversation-item:hover { border-color: var(--border); background: var(--surface-2); }
  .conversation-item.active {
    border-color: rgba(240,183,106,.5);
    background: rgba(240,183,106,.1);
  }
  .conversation-preview {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conversation-badge {
    flex: 0 0 auto;
    padding: 0 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--dim);
    font-size: 10.5px;
  }
  .sidebar-empty { margin: 8px 4px; color: var(--dim); font-size: 12px; }
  @media (max-width: 780px) {
    .sidebar { display: none; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 16px 12px 12px; }
    .messages { max-height: calc(100vh - 220px); padding: 14px 12px; }
    .body { max-width: 84%; }
    .picker-msg .body { max-width: 92%; }
    .links { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>灯下客服</h1>
    </div>
    <div class="links">
      <a href="/kb">知识录入页</a>
      <a href="/rag-eval">RAG 评估</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="会话列表">
      <div class="sidebar-head">
        <span class="sidebar-title">会话</span>
        <button id="new-conversation" class="new-conversation" type="button">新对话</button>
      </div>
      <div id="conversation-list" class="conversation-list"></div>
    </aside>

    <main class="chat-panel">
      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="对话消息">
        <p class="empty" id="empty-hint">您好，我是灯下客服，请问有什么可以帮您的？</p>
      </div>
      <form id="composer" class="composer" autocomplete="off">
        <input type="hidden" id="session-key" value="lamp-cs-ch07-user-id">
        <textarea id="input" rows="1" placeholder="输入您的问题…（Enter 发送，Shift+Enter 换行）" aria-label="消息输入框"></textarea>
        <button id="send" class="primary" type="submit">发送</button>
      </form>
    </main>
  </div>

  <p class="foot">会话与历史按用户 ID 保存在服务端，浏览器标签页的 sessionStorage 中只存用户 ID；退款单只会在您确认后提交。</p>
</div>

<script>
(function () {
  "use strict";

  // Ch07 scopes conversations by a stable user id: the same value is sent as
  // ``session_id`` in chat/refund/ticket payloads and as ``user_id`` to the
  // conversation list/history APIs.
  var SESSION_KEY = "lamp-cs-ch07-user-id";
  var TRANSFER_LABEL = "转人工";
  var TICKET_LABEL = "建工单";
  var REFUND_LABEL = "提交退款工单";
  var TRANSFERRED_TEXT = "已转接人工客服";
  var HUMAN_GREETING = "您好，我是灯下客服，请问有什么可以帮您的？";
  var REFUND_REASONS = ["七天无理由", "质量问题", "发错货", "不想要了", "其他"];
  // Spec §7.2: 90 seconds without a single byte from the server means the
  // stream is dead. Agent turns may involve several tools, so every reader
  // chunk resets this no-progress watchdog.
  var NO_DATA_TIMEOUT_MS = 90000;
  var TIMEOUT_TEXT = "请求超时，请稍后重试。";

  var messages = document.getElementById("messages");
  var emptyHint = document.getElementById("empty-hint");
  var composer = document.getElementById("composer");
  var input = document.getElementById("input");
  var sendButton = document.getElementById("send");
  var conversationList = document.getElementById("conversation-list");
  var newConversationButton = document.getElementById("new-conversation");

  var sessionId = getSessionId();
  var lastUserMessage = "";
  var streaming = false;          // a request/stream is in flight
  var pickerPending = false;      // waiting for the user to pick an order
  var activeConversationId = null; // conversation the next turn continues
  var historyToken = 0;           // guards stale history responses on switch

  function getSessionId() {
    try {
      var existing = sessionStorage.getItem(SESSION_KEY);
      if (existing) return existing;
      var generated = newSessionId();
      sessionStorage.setItem(SESSION_KEY, generated);
      return generated;
    } catch (err) {
      return newSessionId();
    }
  }

  function newSessionId() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return window.crypto.randomUUID();
    }
    return "ch07-" + Date.now().toString(36) + "-" + Math.random().toString(16).slice(2);
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  function hideEmptyHint() {
    if (emptyHint && emptyHint.parentNode) emptyHint.parentNode.removeChild(emptyHint);
    emptyHint = null;
  }

  /* ---------- multi-conversation sidebar ---------- */

  function markActiveConversation() {
    if (!conversationList) return;
    var items = conversationList.querySelectorAll(".conversation-item");
    for (var i = 0; i < items.length; i += 1) {
      var itemId = Number(items[i].getAttribute("data-id"));
      if (itemId === activeConversationId) items[i].classList.add("active");
      else items[i].classList.remove("active");
    }
  }

  function renderConversations(items) {
    if (!conversationList) return;
    conversationList.innerHTML = "";
    if (!items.length) {
      conversationList.append(el("p", "sidebar-empty", "还没有会话，发一句话就开始。"));
      return;
    }
    items.forEach(function (item) {
      if (!item || item.id === undefined || item.id === null) return;
      var id = Number(item.id);
      var button = el("button", "conversation-item");
      button.type = "button";
      button.setAttribute("data-id", String(id));
      if (id === activeConversationId) button.classList.add("active");
      button.append(el("span", "conversation-preview", item.preview || "（空会话）"));
      if (item.has_summary) button.append(el("span", "conversation-badge", "已摘要"));
      button.addEventListener("click", function () {
        if (streaming || pickerPending) return;
        switchConversation(id);
      });
      conversationList.append(button);
    });
  }

  // Sidebar failures are silent: chat must keep working with or without it.
  function loadConversations() {
    if (!conversationList) return;
    fetch("/api/conversations?user_id=" + encodeURIComponent(sessionId))
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function (data) {
        renderConversations((data && data.conversations) || []);
      })
      .catch(function () { /* silent by design */ });
  }

  function clearMessages() {
    messages.innerHTML = "";
    emptyHint = el("p", "empty", HUMAN_GREETING);
    emptyHint.id = "empty-hint";
    messages.append(emptyHint);
  }

  function renderHistory(rows) {
    var lastUser = "";
    rows.forEach(function (row) {
      if (!row || (row.role !== "user" && row.role !== "assistant")) return;
      appendMessage(row.role, row.content || "");
      if (row.role === "user") lastUser = row.content || "";
    });
    lastUserMessage = lastUser;
    scrollToBottom();
  }

  // Click-to-switch: pin the id, reload the dialog, then continue in it.
  function switchConversation(id) {
    if (streaming || pickerPending) return;
    activeConversationId = id;
    lastUserMessage = "";
    historyToken += 1;
    var token = historyToken;
    clearMessages();
    markActiveConversation();
    fetch(
      "/api/conversations/" + encodeURIComponent(id) +
        "/messages?user_id=" + encodeURIComponent(sessionId)
    )
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function (data) {
        if (token !== historyToken) return;
        renderHistory((data && data.messages) || []);
      })
      .catch(function () { /* silent by design */ });
  }

  // "新对话" only opens a fresh conversation; old ones stay in the sidebar.
  function newConversation() {
    if (streaming || pickerPending) return;
    activeConversationId = null;
    lastUserMessage = "";
    historyToken += 1;
    clearMessages();
    markActiveConversation();
    input.focus();
  }


  function syncComposer() {
    var locked = streaming || pickerPending;
    input.disabled = locked;
    sendButton.disabled = locked;
    if (newConversationButton) newConversationButton.disabled = locked;
    if (conversationList) {
      if (locked) conversationList.classList.add("locked");
      else conversationList.classList.remove("locked");
    }
  }

  function appendMessage(role, text) {
    hideEmptyHint();
    var row = el("div", "msg " + role);
    var labels = { user: "我", assistant: "灯下", system: "系统" };
    var avatar = el("span", "avatar", labels[role] || "系统");
    var body = el("div", "body");
    var bubble = el("div", "bubble", role === "system" ? null : text);
    body.append(bubble);
    row.append(avatar, body);
    messages.append(row);
    scrollToBottom();
    return { row: row, body: body, bubble: bubble };
  }

  function appendSystemMessage(text, isError) {
    hideEmptyHint();
    var row = el("div", "msg system" + (isError ? " error" : ""), text);
    messages.append(row);
    scrollToBottom();
    return row;
  }

  function startAssistantMessage() {
    var node = appendMessage("assistant", "");
    node.bubble.classList.add("streaming");
    var typing = el("span", "typing", "正在输入…");
    node.bubble.append(typing);
    return {
      row: node.row,
      body: node.body,
      bubble: node.bubble,
      typing: typing,
      textNode: null,
      meta: null,
      options: null,
      answer: "",
      errored: false,
      interrupted: false
    };
  }

  function pushMeta(ctx, text) {
    if (!ctx.meta) {
      ctx.meta = el("div", "meta-line");
      ctx.body.append(ctx.meta);
    }
    ctx.meta.textContent = ctx.meta.textContent
      ? ctx.meta.textContent + " · " + text
      : text;
    scrollToBottom();
  }

  function appendToken(ctx, token) {
    if (!token) return;
    if (ctx.typing) {
      if (ctx.typing.parentNode) ctx.typing.parentNode.removeChild(ctx.typing);
      ctx.typing = null;
    }
    if (!ctx.textNode) {
      ctx.textNode = document.createTextNode("");
      ctx.bubble.append(ctx.textNode);
    }
    ctx.textNode.appendData(token);
    ctx.answer += token;
    ctx.bubble.classList.remove("error");
    scrollToBottom();
  }

  function showError(ctx, message) {
    var text = message || "请求失败，请稍后重试。";
    if (ctx.typing) {
      if (ctx.typing.parentNode) ctx.typing.parentNode.removeChild(ctx.typing);
      ctx.typing = null;
    }
    ctx.errored = true;
    if (ctx.answer) {
      appendSystemMessage(text, true);
    } else {
      ctx.bubble.textContent = text;
      ctx.bubble.classList.add("error");
      scrollToBottom();
    }
  }

  function finishAssistantMessage(ctx) {
    if (ctx.typing) {
      if (ctx.typing.parentNode) ctx.typing.parentNode.removeChild(ctx.typing);
      ctx.typing = null;
    }
    ctx.bubble.classList.remove("streaming");
    if (ctx.interrupted) {
      // The turn stopped to ask for an order: an empty bubble is noise.
      if (!ctx.answer && ctx.row.parentNode) {
        ctx.row.parentNode.removeChild(ctx.row);
      }
      return;
    }
    if (!ctx.answer && !ctx.errored && !ctx.bubble.textContent) {
      ctx.bubble.textContent = "（客服暂无回复）";
      ctx.bubble.classList.add("error");
    }
  }

  /* ---------- order picker (interrupt kind=select_order) ---------- */

  function orderItemsText(order) {
    var items = order && order.items;
    if (!Array.isArray(items) || items.length === 0) return "商品信息暂缺";
    return items.map(function (item) {
      var name = item && item.name ? String(item.name) : "商品";
      var qty = item && item.qty ? item.qty : 1;
      return name + " ×" + qty;
    }).join("；");
  }

  function moneyText(amount) {
    var value = Number(amount);
    if (!isFinite(value)) return "金额暂缺";
    return "¥" + value.toFixed(2);
  }

  function signedText(order) {
    return order && order.signed_at ? String(order.signed_at) : "未签收";
  }

  function appendOrderPicker(payload) {
    var orders = Array.isArray(payload.orders) ? payload.orders : [];
    hideEmptyHint();
    var row = el("div", "msg assistant picker-msg");
    var avatar = el("span", "avatar", "灯下");
    var body = el("div", "body");
    var bubble = el("div", "bubble picker-bubble");
    bubble.append(el("div", "picker-title", "找到多个订单，请选择要处理的一单："));

    var list = el("div", "order-list");
    var cards = [];

    orders.forEach(function (order) {
      var record = (order && typeof order === "object") ? order : { order_id: String(order) };
      var orderId = record.order_id ? String(record.order_id) : "";
      var card = el("button", "order-card");
      card.type = "button";

      var top = el("div", "order-card-top");
      top.append(el("span", "order-no", "订单号 " + orderId));
      top.append(el("span", "order-status", record.status ? String(record.status) : "状态未知"));
      card.append(top);
      card.append(el("div", "order-items", orderItemsText(record)));

      var sub = el("div", "order-sub");
      var amount = el("strong", null, moneyText(record.amount));
      sub.append(document.createTextNode("金额 "));
      sub.append(amount);
      sub.append(document.createTextNode(" · 签收时间 " + signedText(record)));
      card.append(sub);

      card.addEventListener("click", function () {
        selectOrder(orderId, cards);
      });
      cards.push(card);
      list.append(card);
    });

    bubble.append(list);
    body.append(bubble);
    row.append(avatar, body);
    messages.append(row);
    scrollToBottom();
    return cards;
  }

  function handleInterrupt(ctx, payload) {
    var kind = payload && payload.kind;
    if (kind !== "select_order" && kind !== "confirm_ticket") return;
    ctx.interrupted = true;
    if (ctx.typing) {
      if (ctx.typing.parentNode) ctx.typing.parentNode.removeChild(ctx.typing);
      ctx.typing = null;
    }
    pickerPending = true;
    syncComposer();
    if (kind === "select_order") appendOrderPicker(payload);
    else appendTicketPreview(payload);
  }

  function selectOrder(orderId, cards) {
    if (streaming) return;
    cards.forEach(function (card) { card.disabled = true; });
    appendSystemMessage("已选择订单 " + orderId);

    var ctx = startAssistantMessage();
    streaming = true;
    syncComposer();

    var controller = new AbortController();
    var timedOut = false;
    var watchdog = startWatchdog(controller, function () {
      timedOut = true;
      showError(ctx, TIMEOUT_TEXT);
    });

    fetch("/ch07/chat/resume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: sessionId,
        order_id: orderId,
        conversation_id: activeConversationId
      }),
      signal: controller.signal
    })
      .then(function (response) {
        if (!response.ok) {
          return readErrorDetail(response).then(function (detail) {
            showError(ctx, detail);
          });
        }
        return readSSE(response, function (payload) {
          watchdog.touch();
          handlePayload(ctx, payload);
        }, watchdog.touch);
      })
      .catch(function (err) {
        if (err && err.name === "AbortError") {
          if (!timedOut) showError(ctx, TIMEOUT_TEXT);
          return;
        }
        showError(ctx, "请求失败：" + (err && err.message ? err.message : String(err)));
      })
      .finally(function () {
        watchdog.clear();
        finishAssistantMessage(ctx);
        streaming = false;
        if (ctx.interrupted) {
          // Resumed turn paused on another picker: keep the composer locked.
          pickerPending = true;
        } else {
          pickerPending = false;
          if (ctx.errored) {
            // The resume failed: let the user retry the same order cards.
            cards.forEach(function (card) { card.disabled = false; });
          }
        }
        syncComposer();
        loadConversations();
        if (!streaming && !pickerPending) input.focus();
      });
  }

  /* ---------- ticket preview (interrupt kind=confirm_ticket) ---------- */

  // Render the pending tool call as a read-only preview. The user either
  // confirms (the backend creates the ticket) or cancels; both paths resume
  // the paused graph through /ch07/chat/resume and stream the next turn.
  function appendTicketPreview(payload) {
    var preview = (payload && payload.preview && typeof payload.preview === "object")
      ? payload.preview
      : {};
    var ticketType = preview.ticket_type ? String(preview.ticket_type) : "咨询";
    var description = preview.description ? String(preview.description) : "未提供问题描述";

    hideEmptyHint();
    var row = el("div", "msg assistant picker-msg");
    var avatar = el("span", "avatar", "灯下");
    var body = el("div", "body");
    var card = el("div", "ticket-preview");

    card.append(el("div", "ticket-preview-title", "工单预览"));

    var typeLine = el("div", "ticket-preview-field");
    typeLine.append(el("span", "ticket-preview-label", "工单类型："));
    typeLine.append(el("span", null, ticketType));
    card.append(typeLine);

    var descLine = el("div", "ticket-preview-field");
    descLine.append(el("span", "ticket-preview-label", "问题描述："));
    descLine.append(el("span", "ticket-preview-desc", description));
    card.append(descLine);

    var confirmButton = el("button", "option-btn accent", "确认提交");
    confirmButton.type = "button";
    var cancelButton = el("button", "option-btn", "取消");
    cancelButton.type = "button";
    var controls = [confirmButton, cancelButton];

    confirmButton.addEventListener("click", function () {
      resumeTicket(true, controls);
    });
    cancelButton.addEventListener("click", function () {
      resumeTicket(false, controls);
    });

    var actions = el("div", "ticket-actions");
    actions.append(confirmButton, cancelButton);
    card.append(actions);

    body.append(card);
    row.append(avatar, body);
    messages.append(row);
    scrollToBottom();
    return controls;
  }

  function resumeTicket(confirmed, controls) {
    if (streaming) return;
    controls.forEach(function (button) { button.disabled = true; });
    appendSystemMessage(confirmed ? "已提交工单" : "已取消建单");

    var ctx = startAssistantMessage();
    streaming = true;
    syncComposer();

    var controller = new AbortController();
    var timedOut = false;
    var watchdog = startWatchdog(controller, function () {
      timedOut = true;
      showError(ctx, TIMEOUT_TEXT);
    });

    fetch("/ch07/chat/resume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: sessionId,
        conversation_id: activeConversationId,
        confirmed: confirmed
      }),
      signal: controller.signal
    })
      .then(function (response) {
        if (!response.ok) {
          return readErrorDetail(response).then(function (detail) {
            showError(ctx, detail);
          });
        }
        return readSSE(response, function (payload) {
          watchdog.touch();
          handlePayload(ctx, payload);
        }, watchdog.touch);
      })
      .catch(function (err) {
        if (err && err.name === "AbortError") {
          if (!timedOut) showError(ctx, TIMEOUT_TEXT);
          return;
        }
        showError(ctx, "请求失败：" + (err && err.message ? err.message : String(err)));
      })
      .finally(function () {
        watchdog.clear();
        finishAssistantMessage(ctx);
        streaming = false;
        if (ctx.interrupted) {
          // The resumed turn paused on another interrupt: keep the composer
          // locked and leave the new picker/preview in charge.
          pickerPending = true;
        } else {
          pickerPending = false;
          if (ctx.errored) {
            // The resume failed: let the user retry this confirmation.
            controls.forEach(function (button) { button.disabled = false; });
          }
        }
        syncComposer();
        loadConversations();
        if (!streaming && !pickerPending) input.focus();
      });
  }

  /* ---------- options: transfer / ticket / refund form ---------- */

  function renderOptions(ctx, options) {
    var valid = options.filter(function (option) {
      return option && (
        option.action === "transfer" ||
        option.action === "ticket" ||
        option.action === "refund_form"
      );
    });
    if (valid.length === 0) return;
    if (ctx.options && ctx.options.parentNode) {
      ctx.options.parentNode.removeChild(ctx.options);
    }
    var box = el("div", "options");
    valid.forEach(function (option) {
      var label = option.label || (
        option.action === "transfer" ? TRANSFER_LABEL :
        option.action === "ticket" ? TICKET_LABEL : REFUND_LABEL
      );
      var button = el("button", "option-btn", label);
      button.type = "button";
      button.addEventListener("click", function () {
        handleOptionClick(option, button);
      });
      box.append(button);
    });
    ctx.options = box;
    ctx.body.append(box);
    scrollToBottom();
  }

  function handleOptionClick(option, button) {
    if (option.action === "transfer") {
      // Human transfer is a frontend-only simulation: no backend call.
      button.disabled = true;
      appendSystemMessage(TRANSFERRED_TEXT);
      appendMessage("assistant", HUMAN_GREETING);
      return;
    }
    if (option.action === "ticket") {
      if (!confirm("确认创建工单吗？")) return;
      button.disabled = true;
      createTicket(option, button);
      return;
    }
    if (option.action === "refund_form") {
      openRefundForm(option, button);
    }
  }

  function createTicket(option, button) {
    var ticketType = option.ticket_type ? String(option.ticket_type) : "咨询";
    var description = lastUserMessage || "用户请求创建工单";
    var originalLabel = button.textContent;
    button.textContent = "建单中…";
    fetch("/ch05/tickets", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: sessionId,
        description: description,
        ticket_type: ticketType,
        conversation_id: activeConversationId
      })
    })
      .then(function (response) {
        return response.text().then(function (raw) {
          var data = null;
          if (raw) {
            try { data = JSON.parse(raw); } catch (err) { data = null; }
          }
          if (!response.ok) {
            var detail = data && typeof data.detail === "string"
              ? data.detail
              : "HTTP " + response.status;
            throw new Error(detail);
          }
          return data || {};
        });
      })
      .then(function (data) {
        var ticketNo = data && data.ticket_no ? String(data.ticket_no) : "";
        appendSystemMessage(ticketNo ? "工单已创建，工单号：" + ticketNo : "工单已创建");
        button.textContent = "已建工单";
        button.disabled = true;
      })
      .catch(function (err) {
        appendSystemMessage("工单创建失败：" + (err && err.message ? err.message : String(err)), true);
        button.textContent = originalLabel;
        button.disabled = false;
      });
  }

  function openRefundForm(option, trigger) {
    if (trigger.formNode) return;
    var orderId = option.order_id ? String(option.order_id) : "";
    var originalLabel = trigger.textContent;
    trigger.disabled = true;
    trigger.textContent = "填写退款信息…";

    var form = el("div", "refund-form");
    form.append(el("h3", null, "退款工单"));
    form.append(el("div", "meta-line", "退款原因由您选择，提交后生成退款工单。"));

    var orderLabel = el("label", null, "订单号");
    var orderInput = el("input");
    orderInput.type = "text";
    orderInput.value = orderId;
    orderInput.readOnly = true;
    orderLabel.append(orderInput);
    form.append(orderLabel);

    var reasonLabel = el("label", null, "退款原因");
    var reasonSelect = el("select");
    REFUND_REASONS.forEach(function (reason) {
      var opt = el("option", null, reason);
      opt.value = reason;
      reasonSelect.append(opt);
    });
    reasonLabel.append(reasonSelect);
    form.append(reasonLabel);

    var result = el("div", "form-result");
    var actions = el("div", "form-actions");
    var submit = el("button", null, "提交退款工单");
    submit.type = "button";
    var cancel = el("button", "secondary", "取消");
    cancel.type = "button";
    actions.append(submit, cancel);
    form.append(actions, result);

    trigger.formNode = form;
    var formHost = (trigger.closest && trigger.closest(".body")) || trigger.parentNode;
    formHost.append(form);
    scrollToBottom();
    // The chat log is its own scroll container; bring the whole form into
    // view instead of only scrolling to the bottom (the form is taller than
    // the remaining visible space after a long policy answer).
    if (typeof form.scrollIntoView === "function") {
      // behavior:auto overrides the container's smooth scrolling so the form
      // is fully visible the moment it opens, not mid-animation.
      form.scrollIntoView({ block: "center", behavior: "auto" });
    }

    cancel.addEventListener("click", function () {
      if (form.parentNode) form.parentNode.removeChild(form);
      trigger.formNode = null;
      trigger.disabled = false;
      trigger.textContent = originalLabel;
    });

    submit.addEventListener("click", function () {
      var reason = reasonSelect.value;
      if (REFUND_REASONS.indexOf(reason) < 0) {
        result.className = "form-result error";
        result.textContent = "请选择有效的退款原因。";
        return;
      }
      submit.disabled = true;
      cancel.disabled = true;
      reasonSelect.disabled = true;
      submit.textContent = "提交中…";
      result.className = "form-result";
      result.textContent = "";

      fetch("/ch07/refunds", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId,
          order_id: orderId,
          reason: reason,
          conversation_id: activeConversationId
        })
      })
        .then(function (response) {
          return response.text().then(function (raw) {
            var data = null;
            if (raw) {
              try { data = JSON.parse(raw); } catch (err) { data = null; }
            }
            if (!response.ok) {
              var detail = data && typeof data.detail === "string"
                ? data.detail
                : "HTTP " + response.status;
              throw new Error(detail);
            }
            return data || {};
          });
        })
        .then(function (data) {
          var ticketNo = data && data.ticket_no ? String(data.ticket_no) : "";
          if (!ticketNo) throw new Error("退款单号缺失");
          result.className = "form-result ok";
          result.textContent = "退款单已创建，退款单号：" + ticketNo;
          submit.textContent = "已提交";
          submit.disabled = true;
          cancel.disabled = true;
          reasonSelect.disabled = true;
          trigger.textContent = "已提交退款工单";
          trigger.disabled = true;
        })
        .catch(function (err) {
          result.className = "form-result error";
          result.textContent = "退款单创建失败：" +
            (err && err.message ? err.message : String(err)) + "，请重试。";
          // Keep the form open and editable so the same request can retry.
          submit.textContent = "提交退款工单";
          submit.disabled = false;
          cancel.disabled = false;
          reasonSelect.disabled = false;
        });
    });
  }

  /* ---------- SSE parsing (same contract as ch05) ---------- */

  function parseEventBlock(block) {
    var lines = block.split("\n");
    var data = [];
    for (var i = 0; i < lines.length; i += 1) {
      var line = lines[i];
      if (line.indexOf("data:") === 0) {
        var value = line.slice(5);
        if (value.charAt(0) === " ") value = value.slice(1);
        data.push(value);
      }
    }
    return data.length ? data.join("\n") : null;
  }

  function drainEvents(buffer, onPayload) {
    var index = buffer.indexOf("\n\n");
    while (index !== -1) {
      var block = buffer.slice(0, index);
      buffer = buffer.slice(index + 2);
      var payload = parseEventBlock(block);
      if (payload !== null) onPayload(payload);
      index = buffer.indexOf("\n\n");
    }
    return buffer;
  }

  function handlePayload(ctx, payload) {
    if (ctx.done) return;
    if (payload === "[DONE]") {
      ctx.done = true;
      return;
    }
    var frame = null;
    try { frame = JSON.parse(payload); } catch (err) { frame = null; }
    if (frame && typeof frame === "object" && !Array.isArray(frame)) {
      if (frame.type === "token" && typeof frame.text === "string") {
        appendToken(ctx, frame.text);
        return;
      }
      if (frame.type === "tool") {
        pushMeta(ctx, "使用工具：" + (frame.label || frame.tool || "工具"));
        return;
      }
      if (frame.type === "sources") {
        if (Array.isArray(frame.sources) && frame.sources.length > 0) {
          pushMeta(ctx, "已检索知识库");
        }
        return;
      }
      if (frame.type === "conversation") {
        // The runtime pins this turn to a conversation; remember it so the
        // next turn continues there and refresh the sidebar entry.
        if (frame.conversation_id !== undefined && frame.conversation_id !== null) {
          activeConversationId = Number(frame.conversation_id);
          markActiveConversation();
          loadConversations();
        }
        return;
      }
      if (frame.type === "options" && Array.isArray(frame.options)) {
        renderOptions(ctx, frame.options);
        return;
      }
      if (frame.type === "interrupt") {
        handleInterrupt(ctx, frame);
        ctx.done = true;
        return;
      }
      if (typeof frame.error === "string") {
        showError(ctx, frame.error);
        ctx.done = true;
        return;
      }
    }
    // Anything else is a raw assistant token forwarded by the backend.
    appendToken(ctx, payload);
  }

  function startWatchdog(controller, onTimeout) {
    var timer = null;
    function touch() {
      if (timer !== null) clearTimeout(timer);
      timer = setTimeout(function () {
        timer = null;
        onTimeout();
        controller.abort();
      }, NO_DATA_TIMEOUT_MS);
    }
    touch();
    return {
      touch: touch,
      clear: function () {
        if (timer !== null) {
          clearTimeout(timer);
          timer = null;
        }
      }
    };
  }

  function readSSE(response, onPayload, onActivity) {
    if (!response.body || typeof response.body.getReader !== "function") {
      return response.text().then(function (text) {
        if (onActivity) onActivity();
        drainEvents(text.replace(/\r\n/g, "\n") + "\n\n", onPayload);
      });
    }
    var reader = response.body.getReader();
    var decoder = new TextDecoder("utf-8");
    var buffer = "";
    function pump() {
      return reader.read().then(function (result) {
        if (result.done) {
          buffer += decoder.decode();
          buffer = drainEvents(buffer.replace(/\r\n/g, "\n") + "\n\n", onPayload);
          return;
        }
        // Any bytes from the server count as progress and reset the watchdog.
        if (onActivity) onActivity();
        buffer += decoder.decode(result.value, { stream: true });
        buffer = buffer.replace(/\r\n/g, "\n");
        buffer = drainEvents(buffer, onPayload);
        return pump();
      });
    }
    return pump();
  }

  function readErrorDetail(response) {
    return response.text().then(function (raw) {
      var data = null;
      if (raw) {
        try { data = JSON.parse(raw); } catch (err) { data = null; }
      }
      if (data && typeof data.detail === "string") return data.detail;
      return "HTTP " + response.status;
    });
  }

  /* ---------- send a new turn ---------- */

  function sendMessage() {
    if (streaming || pickerPending) return;
    var text = input.value.trim();
    if (!text) return;

    // A history fetch started by a sidebar switch must not append the old
    // dialog after this new user message: invalidate it before sending.
    historyToken += 1;

    input.value = "";
    lastUserMessage = text;
    appendMessage("user", text);
    var ctx = startAssistantMessage();
    streaming = true;
    syncComposer();

    var controller = new AbortController();
    var timedOut = false;
    var watchdog = startWatchdog(controller, function () {
      timedOut = true;
      showError(ctx, TIMEOUT_TEXT);
    });

    var payload = { session_id: sessionId, message: text };
    if (activeConversationId === null) {
      // First message of a brand-new chat: ask the runtime to create one.
      payload.new_conversation = true;
    } else {
      payload.conversation_id = activeConversationId;
    }

    fetch("/ch07/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      signal: controller.signal
    })
      .then(function (response) {
        if (!response.ok) {
          return readErrorDetail(response).then(function (detail) {
            showError(ctx, detail);
          });
        }
        return readSSE(response, function (payload) {
          watchdog.touch();
          handlePayload(ctx, payload);
        }, watchdog.touch);
      })
      .catch(function (err) {
        if (err && err.name === "AbortError") {
          if (!timedOut) showError(ctx, TIMEOUT_TEXT);
          return;
        }
        showError(ctx, "请求失败：" + (err && err.message ? err.message : String(err)));
      })
      .finally(function () {
        watchdog.clear();
        finishAssistantMessage(ctx);
        streaming = false;
        if (ctx.interrupted) pickerPending = true;
        syncComposer();
        loadConversations();
        if (!pickerPending) input.focus();
      });
  }

  composer.addEventListener("submit", function (event) {
    event.preventDefault();
    sendMessage();
  });

  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      sendMessage();
    }
  });

  if (newConversationButton) {
    newConversationButton.addEventListener("click", newConversation);
  }
  syncComposer();
  loadConversations();
  input.focus();
})();
</script>
</body>
</html>
