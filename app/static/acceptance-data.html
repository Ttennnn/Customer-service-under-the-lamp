<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>数据产物 · 灯下后台</title>
<link rel="stylesheet" href="/static/acceptance.css">
</head>
<body>
<div id="admin-nav"></div>
<div class="page">
  <header class="page-header">
    <div>
      <h1>数据产物</h1>
      <p class="subtitle">三份考卷、每类分布、泄漏与覆盖、训练与 ONNX 产物。</p>
    </div>
    <a class="linkbtn" href="/acceptance">返回验收总览</a>
  </header>

  <nav class="subnav" aria-label="验收子页">
    <a href="/acceptance">总览</a>
    <a href="/acceptance/eval">评测详细</a>
    <a class="active" href="/acceptance/data">数据产物</a>
    <a href="/acceptance/errors">错例复核</a>
  </nav>

  <section class="panel">
    <div class="cards" id="split-cards"></div>
    <div class="toolbar" style="margin-top:12px">
      <span class="muted">重跑切分 + 训练集增强（重作业）</span>
      <span id="data-job"></span>
    </div>
    <p id="status" class="status" role="status" aria-live="polite">加载中…</p>
  </section>

  <section class="panel" id="empty-panel" hidden>
    <h2>数据集还没生成</h2>
    <p id="empty-hint" class="empty"></p>
    <div id="empty-job"></div>
  </section>

  <section class="panel" id="content" hidden>
    <div class="tabs" role="tablist">
      <button class="tab active" type="button" data-tab="dist" role="tab">每类分布</button>
      <button class="tab" type="button" data-tab="leak" role="tab">泄漏与覆盖</button>
      <button class="tab" type="button" data-tab="files" role="tab">产物盘点</button>
    </div>

    <section class="tab-panel" id="tab-dist">
      <div class="table-wrap">
        <table>
          <thead><tr><th>类目</th><th class="num">train</th><th class="num">val</th><th class="num">test</th><th class="num">train 占比</th><th class="num">val 占比</th><th class="num">test 占比</th><th>三份覆盖</th></tr></thead>
          <tbody id="class-rows"></tbody>
        </table>
      </div>
    </section>

    <section class="tab-panel" id="tab-leak" hidden>
      <div class="kv" id="health"></div>
      <div id="leak-detail" style="margin-top:10px"></div>
      <p class="hint">跨集 exact 重叠必须为 0；增强后还要检查 exact + 近重复泄漏。</p>
    </section>

    <section class="tab-panel" id="tab-files" hidden>
      <div class="table-wrap">
        <table>
          <thead><tr><th>文件</th><th class="num">大小</th><th>修改时间</th></tr></thead>
          <tbody id="files"></tbody>
        </table>
      </div>
    </section>
  </section>
</div>

<script src="/static/admin.js" defer></script>
<script src="/static/acceptance.js"></script>
<script>
(function () {
  "use strict";

  var A = window.Acceptance;
  var statusEl = document.getElementById("status");
  var splitCards = document.getElementById("split-cards");
  var contentEl = document.getElementById("content");
  var emptyPanel = document.getElementById("empty-panel");
  var emptyHint = document.getElementById("empty-hint");
  var classRows = document.getElementById("class-rows");
  var healthEl = document.getElementById("health");
  var leakDetail = document.getElementById("leak-detail");
  var filesEl = document.getElementById("files");

  A.mountJobControls(document.getElementById("data-job"), { job: "ch10-dataset" }, load);
  A.mountJobControls(document.getElementById("empty-job"), { job: "ch10-dataset" }, load);

  function setStatus(message, kind) {
    statusEl.className = "status" + (kind ? " " + kind : "");
    statusEl.textContent = message || "";
  }

  function card(label, value) {
    var node = A.el("div", "card");
    node.appendChild(A.el("div", "card-label", label));
    node.appendChild(A.el("div", "card-value", value));
    return node;
  }

  function fmtSize(bytes) {
    var n = Number(bytes) || 0;
    if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
    if (n > 1024) return (n / 1024).toFixed(1) + " KB";
    return n + " B";
  }

  function renderDistribution(manifest) {
    classRows.textContent = "";
    var perClass = manifest.per_class || {};
    Object.keys(perClass).forEach(function (label) {
      var item = perClass[label] || {};
      var coverage = (manifest.coverage || {})[label] || [];
      var tr = A.el("tr");
      tr.appendChild(A.el("td", null, label));
      ["train", "val", "test"].forEach(function (split) {
        var cell = item[split] || {};
        tr.appendChild(A.el("td", "num", String(cell.count == null ? "—" : cell.count)));
      });
      ["train", "val", "test"].forEach(function (split) {
        var cell = item[split] || {};
        tr.appendChild(A.el("td", "num", A.fmtNumber(cell.ratio, 3)));
      });
      tr.appendChild(A.el("td", null, [true, true, true].map(function (_, index) {
        return coverage[index] ? "✓" : "×";
      }).join(" ")));
      classRows.appendChild(tr);
    });
  }

  function renderLeak(manifest) {
    var leak = manifest.leak || {};
    var augment = manifest.augment_leak || {};
    var gaps = manifest.coverage_gaps || [];
    healthEl.textContent = "";
    healthEl.appendChild(A.el("span", null, "切分泄漏 exact: " +
      "train∩val " + (leak.train_val || 0) +
      " · train∩test " + (leak.train_test || 0) +
      " · val∩test " + (leak.val_test || 0)));
    healthEl.appendChild(A.el("span", null, "增强泄漏 exact " + (augment.exact || 0) +
      " / near " + (augment.near || 0) + " / total " + (augment.total || 0)));
    healthEl.appendChild(A.el("span", null, "近重复合并 " + (manifest.near_duplicates_merged || 0)));
    healthEl.appendChild(A.el("span", null, "seed " + (manifest.seed == null ? "—" : manifest.seed)));

    leakDetail.textContent = "";
    var gate = A.el("div", "gate " + (gaps.length ? "fail" : "pass"));
    gate.appendChild(A.el("div", "gate-head"));
    gate.appendChild(A.el("div", "gate-title", gaps.length ? "覆盖有缺口" : "三份覆盖完整"));
    gate.appendChild(A.el("div", "hint", gaps.length
      ? gaps.map(function (gap) { return gap.label + "/" + gap.split; }).join("、")
      : "每个类目在 train/val/test 都有样本"));
    leakDetail.appendChild(gate);
    leakDetail.appendChild(A.el("p", "hint", "语料构成：" + JSON.stringify(manifest.origin_counts || {})));
    leakDetail.appendChild(A.el("p", "hint", "增强条数：" +
      (manifest.train_augmented_count == null ? "—" : manifest.train_augmented_count) +
      " · curated " + (manifest.curated_count || 0)));
  }

  function renderFiles(files) {
    filesEl.textContent = "";
    files.forEach(function (file) {
      var tr = A.el("tr");
      tr.appendChild(A.el("td", null, file.path));
      tr.appendChild(A.el("td", "num", fmtSize(file.size)));
      tr.appendChild(A.el("td", null, A.fmtTime(new Date((file.modified_at || 0) * 1000))));
      filesEl.appendChild(tr);
    });
    if (!files.length) {
      var tr = A.el("tr");
      tr.appendChild(A.el("td", null, "—"));
      tr.appendChild(A.el("td", null, "—"));
      tr.appendChild(A.el("td", null, "没有可列出的产物"));
      filesEl.appendChild(tr);
    }
  }

  function render(data) {
    var manifest = data.manifest || {};
    var counts = manifest.counts || {};
    var augment = manifest.augment_leak || {};
    splitCards.textContent = "";
    splitCards.appendChild(card("train", String(counts.train || 0)));
    splitCards.appendChild(card("val", String(counts.val || 0)));
    splitCards.appendChild(card("test", String(counts.test || 0)));
    splitCards.appendChild(card("增强后泄漏", String(augment.total == null ? "—" : augment.total)));
    splitCards.appendChild(card("curated", String(manifest.curated_count || 0)));
    renderDistribution(manifest);
    renderLeak(manifest);
    renderFiles(data.files || []);
  }

  function load() {
    setStatus("加载中…");
    A.jsonFetch("/api/acceptance/data")
      .then(function (data) {
        if (!data.present) {
          contentEl.hidden = true;
          emptyPanel.hidden = false;
          emptyHint.textContent = data.hint || "make ch10-dataset";
          setStatus("数据集还没生成。", "error");
          return;
        }
        emptyPanel.hidden = true;
        contentEl.hidden = false;
        render(data);
        setStatus("");
      })
      .catch(function (err) {
        setStatus("加载失败：" + err.message, "error");
      });
  }

  load();
})();
</script>
</body>
</html>
