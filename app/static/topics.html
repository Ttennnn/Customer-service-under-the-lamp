<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>主题分布 · 灯下后台</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #171310; --surface: #211b16; --surface-2: #2a231c;
    --border: #332b24; --text: #f2e9de; --dim: #a29284;
    --accent: #f0b76a; --green: #86a96b; --red: #d97757;
    --panel: #211b16; --muted: #a29284; --chip: #2a231c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 18px 48px; background:
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(240,183,106,.12), transparent 70%),
      var(--bg);
    color: var(--text); font: 14px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .page { max-width: 1120px; margin: 0 auto; }
  .page-header { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { margin: 0 0 5px; font-size: 21px; letter-spacing: .02em; }
  h2 { margin: 0 0 10px; font-size: 16px; }
  .subtitle { margin: 0; color: var(--dim); font-size: 12.5px; line-height: 1.6; }
  .linkbtn, button {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 12.5px;
    cursor: pointer; text-decoration: none; transition: border-color .15s, color .15s;
  }
  .linkbtn:hover, button:hover { border-color: var(--accent); color: var(--accent); }
  .panel { background: linear-gradient(180deg, rgba(42,35,28,.55), rgba(33,27,22,.9)); border: 1px solid var(--border); border-radius: 14px; padding: 15px 16px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 0 0 14px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; }
  .stat-label { color: var(--dim); font-size: 11.5px; }
  .stat-value { font-size: 21px; font-weight: 650; margin-top: 1px; }
  .status { min-height: 20px; margin: 6px 0; color: var(--dim); font-size: 12.5px; }
  .status.error { color: var(--red); }
  .bars { display: flex; flex-direction: column; gap: 7px; }
  .bar-row { display: grid; grid-template-columns: 104px minmax(0,1fr) 72px; gap: 10px; align-items: center; }
  .bar-label { font-weight: 600; color: var(--text); text-decoration: none; font-size: 13px; }
  .bar-label:hover { color: var(--accent); }
  .track { height: 16px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 999px; min-width: 2px; }
  .bar-count { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  .samples { grid-column: 2 / 4; margin: -2px 0 4px; padding: 0 0 0 4px; color: var(--dim); font-size: 12px; }
  .samples li { list-style: none; margin: 2px 0; }
  .samples a { color: var(--dim); text-decoration: none; border-bottom: 1px dotted var(--border); }
  .samples a:hover { color: var(--accent); }
  .empty { color: var(--dim); padding: 14px 0; font-size: 12.5px; }
  .hint { color: var(--dim); font-size: 12px; }
  @media (max-width: 720px) { .stats { grid-template-columns: 1fr; } .bar-row { grid-template-columns: 80px minmax(0,1fr) 54px; } .samples { grid-column: 2 / 4; } }
</style>
</head>
<body>
<div id="admin-nav"></div>
<div class="page">
  <header class="page-header">
    <div>
      <h1>主题分布</h1>
      <p class="subtitle">旁路分类器把攒下的低置信问题按 17 类归档；哪类堆得多，一眼看出来。</p>
    </div>
    <a class="linkbtn" href="/admin">返回后台首页</a>
  </header>

  <section class="stats" aria-label="归类概况">
    <div class="stat"><div class="stat-label">已归类</div><div class="stat-value" id="total">—</div></div>
    <div class="stat"><div class="stat-label">未归类</div><div class="stat-value" id="pending">—</div></div>
    <div class="stat"><div class="stat-label">最近归类</div><div class="stat-value" id="last" style="font-size:15px">—</div></div>
  </section>

  <p id="status" class="status" role="status" aria-live="polite">加载中…</p>

  <main class="panel">
    <h2>17 类问题量</h2>
    <div id="bars" class="bars"></div>
    <p id="empty" class="empty" hidden>还没有归类结果。先跑 <code>make classify-pool FORCE=1</code>。</p>
    <p class="hint">计数按标签算：一条多诉求问题会同时计入命中的每个类目。</p>
  </main>
</div>

<script src="/static/admin.js" defer></script>
<script>
(function () {
  "use strict";

  var totalEl = document.getElementById("total");
  var pendingEl = document.getElementById("pending");
  var lastEl = document.getElementById("last");
  var statusEl = document.getElementById("status");
  var barsEl = document.getElementById("bars");
  var emptyEl = document.getElementById("empty");

  function setStatus(message, kind) {
    statusEl.className = "status" + (kind ? " " + kind : "");
    statusEl.textContent = message || "";
  }

  function fmtTime(value) {
    if (!value) return "—";
    var date = new Date(value);
    if (isNaN(date.getTime())) return String(value);
    return date.toLocaleString("zh-CN", { hour12: false });
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function render(data) {
    var labels = (data.labels || []).slice();
    totalEl.textContent = String(data.total || 0);
    pendingEl.textContent = String(data.pending || 0);
    lastEl.textContent = fmtTime(data.last_classified_at);
    barsEl.textContent = "";

    var max = 1;
    labels.forEach(function (item) { max = Math.max(max, Number(item.count) || 0); });
    labels.sort(function (a, b) {
      return (Number(b.count) || 0) - (Number(a.count) || 0);
    });

    labels.forEach(function (item) {
      var row = el("div", "bar-row");
      var link = el("a", "bar-label", item.label);
      link.href = "/topics/questions?label=" + encodeURIComponent(item.label) + "&page=1&size=20";
      var track = el("div", "track");
      var fill = el("div", "fill");
      var count = Number(item.count) || 0;
      fill.style.width = Math.max(1, Math.round(count / max * 100)) + "%";
      track.appendChild(fill);
      var countEl = el("div", "bar-count", count);
      row.appendChild(link);
      row.appendChild(track);
      row.appendChild(countEl);
      barsEl.appendChild(row);

      if (item.samples && item.samples.length) {
        var list = el("ul", "samples");
        item.samples.forEach(function (sample) {
          var li = el("li");
          var a = el("a", null, sample.text);
          a.href = "/topics/questions?label=" + encodeURIComponent(item.label) + "&page=1&size=20";
          li.appendChild(a);
          list.appendChild(li);
        });
        barsEl.appendChild(list);
      }
    });

    emptyEl.hidden = (data.total || 0) > 0;
  }

  function load() {
    setStatus("加载中…");
    fetch("/api/topics/distribution")
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function (data) {
        render(data || {});
        setStatus("");
      })
      .catch(function (err) {
        setStatus("加载失败：" + err.message, "error");
      });
  }

  load();
})();
</script>
</body>
</html>
